<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&display=swap');
:root {
  --bg: #0D0D0D; --surface: #161616; --surface2: #1E1E1E; --surface3: #252525;
  --gold: #C9933A; --gold2: #E8B85C; --green: #5DBF44; --red: #D64045;
  --text: #F0EDE8; --dim: #8A8680; --dimmer: #555; --border: #2A2A2A; --glow: #3A3A3A;
  --mono: 'Space Mono', monospace; --sans: 'DM Sans', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; overflow-x: hidden; }

/* ── HEADER ── */
header { background: linear-gradient(135deg, #0D0D0D, #1A1208 50%, #0D0D0D); border-bottom: 1px solid var(--gold); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; flex-wrap: wrap; gap: 12px; }
.logo { font-family: var(--mono); font-size: 11px; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; line-height: 1.4; }
.logo span { color: var(--dim); }
.db-badge { background: var(--gold); color: #000; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
.hstats { display: flex; gap: 18px; flex-wrap: wrap; }
.hstat .v { font-family: var(--mono); font-size: 16px; font-weight: 700; color: var(--gold); display: block; }
.hstat .l { font-size: 8px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }

/* ── LAYOUT ── */
.app { display: grid; grid-template-columns: 380px 1fr; min-height: calc(100vh - 57px); }

/* ── LEFT PANEL (DATABASE) ── */
.left { background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; max-height: calc(100vh - 57px); position: sticky; top: 57px; }
.ph { padding: 14px 18px 8px; border-bottom: 1px solid var(--border); background: var(--surface2); }
.pt { font-family: var(--mono); font-size: 8px; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
.search { width: 100%; background: var(--surface3); border: 1px solid var(--glow); border-radius: 6px; color: var(--text); font-family: var(--sans); font-size: 13px; padding: 8px 11px; outline: none; transition: border-color .2s; }
.search:focus { border-color: var(--gold); }
.cats { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 14px; border-bottom: 1px solid var(--border); }
.cb { background: var(--surface3); border: 1px solid var(--border); color: var(--dim); font-size: 8px; font-family: var(--mono); padding: 3px 8px; border-radius: 4px; cursor: pointer; transition: all .15s; text-transform: uppercase; }
.cb:hover, .cb.on { background: var(--gold); border-color: var(--gold); color: #000; }

/* ── LIST ITEMS & WRAP TEXT MAGIC ── */
.ilist { padding: 4px 0; }
.iitem { display: flex; align-items: flex-start; gap: 10px; padding: 10px 18px; cursor: pointer; transition: background .1s; border-bottom: 1px solid rgba(255,255,255,.03); }
.iitem:hover { background: var(--surface2); }
.iitem.sel { background: rgba(201,147,58,.1); border-left: 2px solid var(--gold); }
.iem { font-size: 18px; width: 24px; text-align: center; flex-shrink: 0; line-height: 1.2; }
.iin { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.iname { font-size: 12px; font-weight: 600; color: var(--text); white-space: normal; line-height: 1.3; word-break: break-word; }
.imeta { font-size: 9px; color: var(--dim); font-family: var(--mono); white-space: normal; line-height: 1.3; }
.iprot { font-family: var(--mono); font-size: 10px; color: var(--gold); flex-shrink: 0; font-weight: bold; margin-top: 2px; }

/* ── RIGHT PANEL (TRACKER) ── */
.right { overflow-y: auto; padding: 20px 24px; max-height: calc(100vh - 57px); }
.meal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 20px; }
.mtitle { font-family: var(--mono); font-size: 8px; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
.clrbtn { background: none; border: 1px solid var(--red); color: var(--red); font-size: 8px; font-family: var(--mono); padding: 3px 8px; border-radius: 4px; cursor: pointer; transition: all 0.2s; }
.clrbtn:hover { background: var(--red); color: #fff; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; min-height: 40px; }
.empty { color: var(--dimmer); font-size: 12px; font-style: italic; align-self: center; }

/* ── WRAPPING CHIPS ── */
.chip { display: flex; align-items: center; gap: 6px; background: var(--surface2); border: 1px solid var(--glow); border-radius: 7px; padding: 6px 10px; font-size: 11px; height: auto; min-height: 34px; flex-wrap: wrap; }
.chip span:nth-child(2) { white-space: normal; line-height: 1.2; max-width: 140px; word-break: break-word; }
.chip input { width: 50px; background: var(--surface3); border: 1px solid var(--border); border-radius: 4px; color: var(--gold); font-family: var(--mono); font-size: 11px; padding: 3px 5px; text-align: center; outline: none; }
.chip input:focus { border-color: var(--gold); }
.cunit { font-size: 9px; color: var(--dim); font-family: var(--mono); }
.crm { color: var(--dimmer); cursor: pointer; font-size: 14px; padding-left: 4px; transition: color 0.2s; }
.crm:hover { color: var(--red); }

/* ── MACRO BAR & NUTRIENT GRID ── */
.mbar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 20px; }
.mcard { background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 12px 10px; text-align: center; position: relative; overflow: hidden; }
.mcard::after { content: ''; position: absolute; bottom: 0; left: 0; height: 3px; background: var(--gold); transition: width .5s; width: var(--pct, 0%); }
.mv { font-family: var(--mono); font-size: 18px; font-weight: 700; color: var(--gold2); display: block; margin-bottom: 1px; }
.ml { font-size: 8px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 4px; }
.stitle { font-family: var(--mono); font-size: 8px; color: var(--dim); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px; padding-bottom: 6px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
.ngrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(185px, 1fr)); gap: 8px; margin-bottom: 20px; }
.ncard { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px; position: relative; }
.ncard.smashed { border-color: rgba(93,191,68,.35); }
.ncard.solid { border-color: rgba(201,147,58,.35); }
.ncard.low { border-color: rgba(214,64,69,.2); }
.nn { font-size: 10px; font-weight: 600; color: var(--text); }
.nvals { display: flex; justify-content: space-between; align-items: baseline; margin-top: 6px; }
.na { font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--gold2); }
.np { font-family: var(--mono); font-size: 9px; color: var(--dim); }
.nbar { height: 3px; background: var(--border); border-radius: 2px; margin-top: 4px; overflow: hidden; }
.nbf { height: 100%; border-radius: 2px; transition: width .5s; }
.fs { background: linear-gradient(90deg, #3E8A2A, #5DBF44); }
.fo { background: linear-gradient(90deg, #8B5E1A, #C9933A); }
.fl { background: linear-gradient(90deg, #8B1E20, #D64045); }

/* ── RECIPE CARDS ── */
.rcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-bottom: 30px; }
.rcard { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px; cursor: pointer; transition: all .15s; }
.rcard:hover { border-color: var(--gold); background: rgba(201,147,58,.05); transform: translateY(-2px); }
.rem { font-size: 22px; display: block; margin-bottom: 6px; }
.rname { font-size: 11px; font-weight: 600; color: var(--text); margin-bottom: 4px; line-height: 1.4; }
.rmac { font-family: var(--mono); font-size: 8px; color: var(--dim); line-height: 1.3;}

/* ── RESPONSIVE MEDIA QUERIES ── */
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .left { max-height: 350px; position: relative; top: 0; z-index: 50; }
  .mbar { grid-template-columns: repeat(3, 1fr); }
  .mbar .mcard:nth-child(4), .mbar .mcard:nth-child(5) { grid-column: span 1.5; }
}

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--glow); border-radius: 2px; }
</style>

    name:"🧠 M29 Focus Deploy",

    macros:"478kcal · 31g prot · Rapid Digestion",
    ingredients:[{id:"oats_instant",qty:60}, {id:"ls_protein_46g",qty:200}, {id:"mani_king_natural",qty:1}, {id:"frambuesas_congeladas",qty:125}]

// ── STATE & FILTERS ──
let selected = {}; // id -> qty
const CATS_ORDER = ['ALL','POULTRY','BEEF','PORK','LAMB','GAME','OFFAL','PROCESSED','SEAFOOD','EGGS','DAIRY','LEGUMES','NUTS','GRAINS','BAKERY','VEGETABLES','FRUIT','FATS','CONDIMENTS','PANTRY','BEVERAGES','PLANT_BASED','MEALS','FAST_FOOD','PIZZA','SNACKS','SUPPLEMENTS'];
let activeCat = 'ALL';

function init(){
  const cDiv = document.getElementById('cats');
  CATS_ORDER.forEach(c => {
    const b = document.createElement('button');
    b.className = 'cb' + (c==='ALL'?' on':'');
    b.textContent = c.replace('_',' ');
    b.onclick = () => { activeCat=c; document.querySelectorAll('.cb').forEach(x=>x.classList.remove('on')); b.classList.add('on'); filter(); };
    cDiv.appendChild(b);
  });
  renderList(INGREDIENTS);
  renderNutrients();
  renderRecipes();
}

function filter(){
  const q = document.getElementById('sb').value.toLowerCase();
  const filtered = INGREDIENTS.filter(i => {
    const catOk = activeCat==='ALL' || i.cat===activeCat;
    const nameOk = !q || i.name.toLowerCase().includes(q) || i.id.includes(q);
    return catOk && nameOk;
  });
  renderList(filtered);
}

function renderList(arr){
  const div = document.getElementById('ilist');
  div.innerHTML = '';
  arr.forEach(ing => {
    const el = document.createElement('div');
    el.className = 'iitem' + (selected[ing.id]!==undefined?' sel':'');
    el.innerHTML = `
      <div class="iem">${ing.emoji}</div>
      <div class="iin">
        <div class="iname">${ing.name}</div>
        <div class="imeta">${ing.per100.kcal} kcal · ${ing.per100.protein}g prot per 100g</div>
      </div>
      <div class="iprot">${ing.per100.protein}g</div>`;
    el.onclick = () => toggleIng(ing);
    div.appendChild(el);
  });
}

function toggleIng(ing){
  if(selected[ing.id]!==undefined){ delete selected[ing.id]; } else { selected[ing.id] = ing.defaultQty; }
  saveLoadout();
  renderChips();
  renderNutrients();
  filter();
}

function renderChips(){
  const div = document.getElementById('chips');
  const ids = Object.keys(selected);
  if(!ids.length){ div.innerHTML='<span class="empty">← Click ingredients to populate loadout</span>'; return; }
  div.innerHTML = '';
  ids.forEach(id => {
    const ing = INGREDIENTS.find(i=>i.id===id);
    if(!ing) return;
    const chipText = ing.name.split('/')[1] ? ing.name.split('/')[1].trim().split(' ').slice(0,2).join(' ') : ing.name.split(' ')[0];
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.innerHTML = `<span>${ing.emoji}</span>
      <span style="color:var(--text);font-size:11px">${chipText}</span>
      <div class="chip-qty" style="display:flex;align-items:center;gap:3px;margin-left:4px">
        <input type="number" min="0" step="0.5" value="${selected[id]}" onchange="updateQty('${id}',parseFloat(this.value)||0)">
        <span class="cunit">${ing.unit}</span>
      </div>
      <span class="crm" onclick="removeIng('${id}')">✕</span>`;
    div.appendChild(chip);
  });
}

function updateQty(id, val){
  selected[id] = val;
  saveLoadout();
  renderNutrients();
}

function removeIng(id){
  delete selected[id];
  saveLoadout();
  renderChips();
  renderNutrients();
  filter();
}

function clearAll(){
  selected = {};
  saveLoadout();
  renderChips();
  renderNutrients();
  filter();
}

function getTotals(){
  const totals = {};
  Object.keys(TARGETS).forEach(k => totals[k]=0);
  Object.entries(selected).forEach(([id,qty]) => {
    const ing = INGREDIENTS.find(i=>i.id===id);
    if(!ing) return;
    const grams = ing.unit==='g'||ing.unit==='ml' ? qty : qty*(ing.gramsPerUnit||100);
    const mult = grams/100;
    Object.keys(TARGETS).forEach(k => {
      if(ing.per100[k]!==undefined) totals[k] += (ing.per100[k]||0)*mult;
    });
  });
  return totals;
}

function renderNutrients(){
  const t = getTotals();
  document.getElementById('hk').textContent = Math.round(t.kcal);
  document.getElementById('hp').textContent = t.protein.toFixed(1)+'g';
  
  const macros = ['kcal','protein','carbs','fat','fiber'];
  const mids = ['mk','mp','mc','mf','mfi'];
  const units = ['','g','g','g','g'];
  macros.forEach((k,i) => {
    const el = document.getElementById(mids[i]);
    if(el){
      const val = k==='kcal'?Math.round(t[k]):t[k].toFixed(1);
      el.textContent = val+units[i];
      const pct = Math.min(100,(t[k]/TARGETS[k].val)*100);
      el.closest('.mcard').style.setProperty('--pct',pct+'%');
    }
  });

  const grid = document.getElementById('ngrid');
  grid.innerHTML='';
  let hits=0;
  Object.entries(TARGETS).forEach(([key,tgt]) => {
    const val = t[key]||0;
    const pct = Math.min(150,(val/tgt.val)*100);
    const status = pct>=100?'smashed':pct>=60?'solid':'low';
    if(pct>=100) hits++;
    const card = document.createElement('div');
    card.className='ncard '+status;
    const disp = val<1?val.toFixed(2):val<10?val.toFixed(1):Math.round(val);
    const pctDisp = Math.round(Math.min(pct,999));
    card.innerHTML=`<div class="nh">
      <div class="nn">${tgt.label}</div>
      <span class="nbadge ${status==='smashed'?'bs':status==='solid'?'bo':'bl'}">${pctDisp}%</span>
    </div>
    <div class="nvals">
      <span class="na">${disp}${tgt.unit}</span>
      <span class="np">/${tgt.val}${tgt.unit}</span>
    </div>
    <div class="nbar"><div class="nbf ${status==='smashed'?'fs':status==='solid'?'fo':'fl'}" style="width:${Math.min(100,pct)}%"></div></div>`;
    grid.appendChild(card);
  });
  document.getElementById('nhit').textContent = hits+' / '+Object.keys(TARGETS).length;
}

function renderRecipes(){
  const div = document.getElementById('rcards');
  QUICK_RECIPES.forEach(r => {
    const card = document.createElement('div');
    card.className='rcard';
    card.innerHTML=`<span class="rem">${r.emoji}</span><div class="rname">${r.name}</div><div class="rmac">${r.macros}</div>`;
    card.onclick=()=>{
      r.ingredients.forEach(({id,qty}) => { selected[id]=qty; });
      saveLoadout(); renderChips(); renderNutrients(); filter();
    };
    div.appendChild(card);
  });
}

setTimeout(() => { init(); if(Object.keys(selected).length) renderChips(); }, 100);
