document.addEventListener("DOMContentLoaded", () => {
  document.getElementById('db-count').textContent = INGREDIENTS.length;

const QUICK_RECIPES = [
  {name:"🧠 Focus Deploy",emoji:"💻",macros:"478kcal · 31g prot",ingredients:[{id:"oats_instant",qty:60},{id:"ls_protein_46g",qty:200},{id:"mani_king_natural",qty:1},{id:"frambuesas_congeladas",qty:125}]},
  {name:"🥩 Quad Grill",emoji:"🥩",macros:"568kcal · 49g prot",ingredients:[{id:"lomo_raw",qty:200},{id:"batata_raw",qty:250},{id:"cebolla",qty:100},{id:"morron_rojo",qty:100},{id:"aceite_girasol",qty:1}]},
  {name:"🍲 CABA Stew",emoji:"🍲",macros:"435kcal · 53g prot",ingredients:[{id:"lentils_dry",qty:60},{id:"chicken_breast_raw",qty:150},{id:"extracto_tomate",qty:1},{id:"ajo",qty:1},{id:"acelga_raw",qty:150}]},

  {name:"📉 Kiosko Snack",emoji:"📉",macros:"280kcal · 14g prot",ingredients:[{id:"bizcochos_arroz",qty:1},{id:"casancrem_light",qty:2},{id:"ddl_ser",qty:1}]},
  {name:"🍣 Sushi Bowl",emoji:"🍱",macros:"510kcal · 38g prot",ingredients:[{id:"arroz_gallo_oro",qty:50},{id:"salmon_rosado_raw",qty:150},{id:"nori",qty:1},{id:"soy_sauce",qty:1},{id:"cebolla_verdeo",qty:30}]},
  {name:"🧉 Study Session",emoji:"🧉",macros:"220kcal · 11g prot",ingredients:[{id:"yerba_mate",qty:50},{id:"mix_frutos_secos",qty:30}]}
];

let selected = {};
const CATS_ORDER = ['ALL','POULTRY','BEEF','PORK','LAMB','GAME','OFFAL','PROCESSED','SEAFOOD','EGGS','DAIRY','CHEESE','LEGUMES','NUTS','GRAINS','PASTA','BREAD','BAKERY','VEGETABLES','FRUIT','FATS','CONDIMENTS','SWEETS','BEVERAGES','VEGAN','MEALS','FAST_FOOD','PIZZA','SNACKS','SUPPLEMENTS','PANTRY'];
let activeCat = 'ALL';

function init(){
  const cDiv = document.getElementById('cats');
  CATS_ORDER.forEach(c => {
    const b = document.createElement('button');
    b.className = 'cb' + (c==='ALL'?' on':'');
    b.textContent = c.replace('_',' ');
    b.onclick = () => { activeCat=c; document.querySelectorAll('.cb').forEach(x=>x.classList.remove('on')); b.classList.add('on'); filter(); };
    cDiv.appendChild(b);
  });
  loadLoadout();
  filter();
  renderNutrients();
  renderRecipes();
}

function filter(){
  const q = document.getElementById('sb').value.toLowerCase();
  renderList(INGREDIENTS.filter(i => (activeCat==='ALL'||i.cat===activeCat)&&(!q||i.name.toLowerCase().includes(q)||i.id.includes(q))));
}

function renderList(arr){
  const div = document.getElementById('ilist'); div.innerHTML = '';
  arr.forEach(ing => {
    const el = document.createElement('div');
    el.className = 'iitem' + (selected[ing.id]!==undefined?' sel':'');
    el.innerHTML = `<div class="iem">${ing.emoji}</div><div class="iin"><div class="iname">${ing.name}</div><div class="imeta">${ing.per100.kcal} kcal · ${ing.per100.protein||0}g prot per 100g</div></div><div class="iprot">${ing.per100.protein||0}g</div>`;
    el.onclick = () => toggleIng(ing); div.appendChild(el);
  });
}

function toggleIng(ing){
  if(selected[ing.id]!==undefined){ delete selected[ing.id]; } else { selected[ing.id] = ing.defaultQty; }
  saveLoadout(); renderChips(); renderNutrients(); filter();
}

function renderChips(){
  const div = document.getElementById('chips');
  const ids = Object.keys(selected);
  if(!ids.length){ div.innerHTML='<span class="empty">← Click ingredients to populate loadout</span>'; return; }
  div.innerHTML = '';
  ids.forEach(id => {
    const ing = INGREDIENTS.find(i=>i.id===id); if(!ing) return;
    const chipText = ing.name.split('/')[1] ? ing.name.split('/')[1].trim().split(' ').slice(0,2).join(' ') : ing.name.split(' ')[0];
    const chip = document.createElement('div'); chip.className = 'chip';
    chip.innerHTML = `<span>${ing.emoji}</span><span>${chipText}</span><div class="chip-qty" style="display:flex;align-items:center;gap:3px;margin-left:4px"><input type="number" min="0" step="0.5" value="${selected[id]}" onchange="updateQty('${id}',parseFloat(this.value)||0)"><span class="cunit">${ing.unit}</span></div><span class="crm" onclick="removeIng('${id}')">✕</span>`;
    div.appendChild(chip);
  });
}

function updateQty(id, val){ selected[id] = val; saveLoadout(); renderNutrients(); }
function removeIng(id){ delete selected[id]; saveLoadout(); renderChips(); renderNutrients(); filter(); }
function clearAll(){ selected = {}; saveLoadout(); renderChips(); renderNutrients(); filter(); }

function getTotals(){
  const totals = {}; Object.keys(TARGETS).forEach(k => totals[k]=0);
  Object.entries(selected).forEach(([id,qty]) => {
    const ing = INGREDIENTS.find(i=>i.id===id); if(!ing) return;
    const grams = (ing.unit==='g'||ing.unit==='ml') ? qty : qty*(ing.gramsPerUnit||100);
    Object.keys(TARGETS).forEach(k => { if(ing.per100[k]) totals[k] += (ing.per100[k]*grams/100); });
  });
  return totals;
}

function renderNutrients(){
  const t = getTotals();
  document.getElementById('hk').textContent = Math.round(t.kcal); document.getElementById('hp').textContent = t.protein.toFixed(1)+'g';
  ['kcal','protein','carbs','fat','fiber'].forEach((k,i) => {
    const el = document.getElementById(['mk','mp','mc','mf','mfi'][i]);
    if(el){ el.textContent = (k==='kcal'?Math.round(t[k]):t[k].toFixed(1)) + (k==='kcal'?'':'g'); el.closest('.mcard').style.setProperty('--pct', Math.min(100,(t[k]/TARGETS[k].val)*100)+'%'); }
  });
  const grid = document.getElementById('ngrid'); grid.innerHTML=''; let hits=0;
  Object.entries(TARGETS).forEach(([key,tgt]) => {
    const val = t[key]||0; const pct = Math.min(150,(val/tgt.val)*100); const status = pct>=100?'smashed':pct>=60?'solid':'low';
    if(pct>=100) hits++;
    const card = document.createElement('div'); card.className='ncard '+status;
    const disp = val<1?val.toFixed(2):val<10?val.toFixed(1):Math.round(val);
    card.innerHTML=`<div class="nh"><div class="nn">${tgt.label}</div><span class="nbadge ${status==='smashed'?'bs':status==='solid'?'bo':'bl'}">${Math.round(Math.min(pct,999))}%</span></div><div class="nvals"><span class="na">${disp}${tgt.unit}</span><span class="np">/${tgt.val}${tgt.unit}</span></div><div class="nbar"><div class="nbf ${status==='smashed'?'fs':status==='solid'?'fo':'fl'}" style="width:${Math.min(100,pct)}%"></div></div>`;
    grid.appendChild(card);
  });
  document.getElementById('nhit').textContent = hits+' / '+Object.keys(TARGETS).length;
}

function renderRecipes(){
  const div = document.getElementById('rcards');
  QUICK_RECIPES.forEach(r => {
    const card = document.createElement('div'); card.className='rcard';
    card.innerHTML=`<span class="rem">${r.emoji}</span><div class="rname">${r.name}</div><div class="rmac">${r.macros}</div>`;
    card.onclick=()=>{ r.ingredients.forEach(({id,qty}) => { selected[id]=qty; }); saveLoadout(); renderChips(); renderNutrients(); filter(); };
    div.appendChild(card);
  });
}

setTimeout(() => { init(); if(Object.keys(selected).length) renderChips(); }, 100);
